[theme]
# The main accent color (used for your primary buttons and loading bars)
primaryColor = "#00FFAA"

# The main background color of the main body
backgroundColor = "#0E1117"

# The background color for sidebars and input boxes
secondaryBackgroundColor = "#262730"

# The color of your text
textColor = "#FAFAFA"

# The font family (options: "sans serif", "serif", "monospace")
font = "sans serif"